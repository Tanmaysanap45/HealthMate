<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>HealthMate | AI Coach</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=DM+Sans:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/dashboard.css">
<style>
  .chat-layout {
    display: flex;
    flex-direction: column;
    height: calc(100vh - 170px);
    max-width: 860px;
    margin: 20px auto 0 auto;
    background: #171814;
    border: 1px solid var(--line);
    border-radius: 20px;
    overflow: hidden;
  }
  .chat-box {
    flex: 1;
    overflow-y: auto;
    padding: 24px;
    display: flex;
    flex-direction: column;
    gap: 16px;
  }
  .msg-row {
    display: flex;
    width: 100%;
  }
  .msg-row.user {
    justify-content: flex-end;
  }
  .msg-bubble {
    max-width: 75%;
    padding: 14px 18px;
    border-radius: 16px;
    font-size: 0.95rem;
    line-height: 1.5;
  }
  .msg-row.bot .msg-bubble {
    background: #0e0f0c;
    border: 1px solid var(--line);
    color: var(--text);
    border-bottom-left-radius: 4px;
  }
  .msg-row.user .msg-bubble {
    background: var(--accent);
    color: #0e0f0c;
    font-weight: 500;
    border-bottom-right-radius: 4px;
  }
  .chat-input-bar {
    display: flex;
    gap: 12px;
    padding: 16px 20px;
    background: #0e0f0c;
    border-top: 1px solid var(--line);
  }
  .chat-input-bar input {
    flex: 1;
    background: #171814;
    border: 1px solid var(--line);
    border-radius: 12px;
    padding: 12px 16px;
    color: var(--text);
    font: inherit;
    transition: border-color 0.2s;
  }
  .chat-input-bar input:focus {
    outline: none;
    border-color: var(--accent);
  }

  /* Top bar: Back button on the left, logo next to it */
  .nav-left { display: flex; align-items: center; gap: 18px; }

  /* Back button */
  .back-btn {
    display: inline-flex; align-items: center; gap: 8px;
    background: #171814; color: #f4f4ee;
    border: 1px solid #2a2c25; border-radius: 12px;
    padding: 9px 16px; font-family: inherit; font-size: 0.92rem; font-weight: 500;
    cursor: pointer;
    transition: border-color 0.2s, color 0.2s, background 0.2s;
  }
  .back-btn svg { width: 16px; height: 16px; transition: transform 0.2s; }
  .back-btn:hover { border-color: var(--accent, #d4f938); color: var(--accent, #d4f938); background: #1d1f18; }
  .back-btn:hover svg { transform: translateX(-3px); }
  .back-btn:focus-visible { outline: 2px solid var(--accent, #d4f938); outline-offset: 2px; }
</style>
</head>
<body>
<header class="nav">
  <div class="nav-left">
    <button type="button" class="back-btn" onclick="history.length > 1 ? history.back() : (location.href = 'dashboard.html')">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <line x1="19" y1="12" x2="5" y2="12"></line>
        <polyline points="12 19 5 12 12 5"></polyline>
      </svg>
      Back
    </button>
    <a class="logo" href="dashboard.html">HEALTH<span>MATE</span></a>
  </div>
  <nav>
    <a href="dashboard.html">Dashboard</a>
    <a href="workout.html">Workout</a>
    <a href="diet.html">Diet</a>
    <a href="progress.html">Progress</a>
    <button type="button" id="logoutBtn" class="btn-ghost">Log out</button>
  </nav>
</header>

<main class="dash" style="padding-top: 10px;">
  <p class="eyebrow" style="text-align: center;">Personalized Guidance</p>
  <h1 style="text-align: center;">AI Fitness Coach</h1>

  <div class="chat-layout">
    <div id="chatBox" class="chat-box">
      <div class="msg-row bot">
        <div class="msg-bubble">
          Hello! I'm your HealthMate Coach. Ask me anything about your workout, diet plan, or exercise substitutions!
        </div>
      </div>
    </div>

    <form id="chatForm" class="chat-input-bar">
      <input type="text" id="userInput" placeholder="Ask your coach a question..." autocomplete="off" required>
      <button type="submit" class="btn" style="padding: 0 24px;">Send</button>
    </form>
  </div>
</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/config.js"></script>
<script src="js/chat.js?v=1"></script>
</body>
</html>
